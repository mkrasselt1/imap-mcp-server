services:
  imap-bridge:
    build: .
    image: mkrasselt1/imap-mcp-server:latest
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      # Required — set them in .env (see .env.example); the container refuses to start without them.
      - BASE_URL=${BASE_URL:?set BASE_URL in .env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (openssl rand -hex 32)}
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET in .env (openssl rand -hex 32)}
    restart: unless-stopped
